# vmkit host inventory — machine-specific, shell-sourced.
# Lives at ~/.config/vmkit/host.conf. Validate with: vmkit doctor
#
# The human-setup contract (docs/HUMAN-SETUP.md): a human installs Parallels,
# installs each guest OS, installs Parallels Guest Tools, and takes ONE
# powered-off snapshot named "<VMKIT_SNAP_PREFIX>-golden" per VM. Everything
# after that is vmkit's responsibility.

# Guest architecture this host can run. Apple Silicon hosts run ONLY arm64
# guests; Intel hosts run ONLY x86_64 guests. Plan artifact staging accordingly
# (note: Windows 11 ARM runs x64 binaries under emulation — that is real
# end-user coverage for ARM machines, not a compromise).
VMKIT_ARCH=@ARCH@

# Where bootable working-copy VMs live. POLICY: VMs boot ONLY from here.
VMKIT_INTERNAL_DIR="$HOME/Parallels"

# Snapshot name prefix; snapshots are "<prefix>-golden|-ready|-built|...".
VMKIT_SNAP_PREFIX="vmkit"

# --- one-VM-at-a-time handoff / host-memory guard ---------------------------
# On a single host, booting the next guest before the previous one's RAM is
# reclaimed thrashes into an OOM that SIGKILLs test subprocesses (looks like a
# product regression, isn't). These knobs make the handoff memory-safe.
#
# How to stop the OTHER running guest for one-VM-at-a-time enforcement:
#   shutdown (default) returns the guest's RAM to the host promptly; vmkit
#   reverts to a snapshot next anyway, so nothing is lost. suspend preserves
#   in-guest state (nicer for interactive dev VMs) but holds memory during the
#   handoff — worse for CI stability.
#VMKIT_STOP_MODE=shutdown        # shutdown | suspend

# Headroom (MB) required ABOVE a guest's configured RAM before vmkit will boot
# it — covers the test harness itself. Used by the handoff wait and by doctor.
#VMKIT_MEM_HEADROOM_MB=2048

# How long (seconds) `series`/`reset` will block waiting for host memory to
# recover after stopping the sibling guest before failing loudly with the
# current free-memory reading (instead of a silent multi-minute thrash).
#VMKIT_MEM_WAIT_TIMEOUT=180

# Print a one-line host snapshot (free RAM / swap / load) at each series phase
# boundary. On by default; set to 0 to silence.
#VMKIT_HOST_SNAPSHOT=1

# Optional: archive drive holding dormant clone-source copies of each VM
# (never booted in place) and the offline download cache.
#VMKIT_ARCHIVE_DRIVE="/Volumes/MyArchive"
#VMKIT_CACHE_DIR="/Volumes/MyArchive/vm-toolchain-cache"

# Per-platform VM names as registered in Parallels. Omit a platform entirely
# if this host has no VM for it (series runs skip it).
#VMKIT_VM_WINDOWS="Windows 11 Pro"
#VMKIT_VM_WINDOWS_ARCHIVE="Windows 11 Pro archive"
#VMKIT_VM_LINUX="Ubuntu Linux"
#VMKIT_VM_LINUX_ARCHIVE="Ubuntu Linux archive"
#VMKIT_VM_MACOS="macOS 15.7.7"
#VMKIT_VM_MACOS_ARCHIVE="macOS 15.7.7 archive"
