# vmkit repo config — shell-sourced. Lives at <repo>/vmkit.conf (or
# <repo>/vmtest/vmkit.conf). Defines what THIS repo tests; the machine's VM
# inventory lives in ~/.config/vmkit/host.conf.

# Short project name: names the guest scratch dir (/tmp/<name>-vmkit) that
# macOS pushes land in.
VMKIT_PROJECT="myproject"

# Snapshot that `vmkit test` resets to before every run (resolved against the
# host's VMKIT_SNAP_PREFIX). "built" = provisioned/ready-to-test state you
# capture once via `vmkit checkpoint <vm> built`.
VMKIT_TEST_SNAP="built"

# --- flavors -----------------------------------------------------------------
# Each flavor maps to one guest script per platform (repo-relative path;
# .ps1 for windows, .sh for linux/macos). Guest scripts print greppable
# "PHASE=<name> ok=true|false|SKIP" lines and end with "RESULT=PASS|FAIL|SKIP"
# — source the helpers from vmkit's guest-lib (copy them into your repo; the
# guest cannot reach the host's brew prefix).
#
#   vmkit test linux smoke
#   vmkit series lifecycle          # all configured platforms + summary
VMKIT_FLAVOR_SMOKE_WINDOWS="vmtest/scripts/smoke.ps1"
VMKIT_FLAVOR_SMOKE_LINUX="vmtest/scripts/smoke.sh"
VMKIT_FLAVOR_SMOKE_MACOS="vmtest/scripts/smoke.sh"
VMKIT_FLAVOR_SMOKE_TIMEOUT=360

# --- env & artifact plumbing ----------------------------------------------------
# Host env vars forwarded into the guest when set (explicit env always wins
# over auto-discovery below).
VMKIT_ENV_FORWARD=""

# Artifact auto-discovery: when $VMKIT_ARTIFACT_ENV is unset, vmkit looks for
# these repo-relative paths and passes the guest-visible location in that env
# var. windows/linux paths are read through the Parallels share; the macOS
# artifact is PUSHED into the guest.
#VMKIT_ARTIFACT_ENV="MYPROJECT_EXE"
#VMKIT_ARTIFACT_WINDOWS="vmtest/.downloaded-artifacts/windows/myproject.exe"
#VMKIT_ARTIFACT_LINUX="vmtest/.downloaded-artifacts/linux/myproject"
#VMKIT_ARTIFACT_MACOS="target/release/myproject"

# Optional secrets file pushed into macOS guests (windows/linux read their own
# copy off the share) when the env var is unset.
#VMKIT_SECRETS_ENV="STAGING_SECRETS"
#VMKIT_SECRETS_HOST_DEFAULT="$VMKIT_CACHE_DIR/common/staging.env"

# Guest processes to force-kill when a run times out (a wedged guest process
# outlives its host-side prlctl exec and would poison the next test).
VMKIT_KILL_WINDOWS=""
VMKIT_KILL_UNIX=""
