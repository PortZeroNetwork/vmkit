# Repo config for vmkit's own self-test fixtures. Every flavor here is a
# deliberate shape of guest-script behaviour; tests/run.sh asserts the verdict
# vmkit reports for each.
VMKIT_PROJECT="vmkitselftest"
VMKIT_TEST_SNAP="built"

# Well-formed.
VMKIT_FLAVOR_GOOD_LINUX="vmtest/scripts/good.sh"
VMKIT_FLAVOR_GOOD_MACOS="vmtest/scripts/good.sh"
VMKIT_FLAVOR_GOOD_TIMEOUT=30

# Broken in the ways that used to report PASS.
VMKIT_FLAVOR_NORESULT_LINUX="vmtest/scripts/noresult.sh"
VMKIT_FLAVOR_NORESULT_TIMEOUT=30
VMKIT_FLAVOR_MISSINGLIB_LINUX="vmtest/scripts/missinglib.sh"
VMKIT_FLAVOR_MISSINGLIB_TIMEOUT=30
VMKIT_FLAVOR_PASSTHENEXIT1_LINUX="vmtest/scripts/passthenexit1.sh"
VMKIT_FLAVOR_PASSTHENEXIT1_TIMEOUT=30
VMKIT_FLAVOR_SILENT_LINUX="vmtest/scripts/silent.sh"
VMKIT_FLAVOR_SILENT_MACOS="vmtest/scripts/silent.sh"
VMKIT_FLAVOR_SILENT_TIMEOUT=30
VMKIT_FLAVOR_BADVERDICT_LINUX="vmtest/scripts/badverdict.sh"
VMKIT_FLAVOR_BADVERDICT_TIMEOUT=30

# Honest verdicts that are not PASS.
VMKIT_FLAVOR_RESULTFAIL_LINUX="vmtest/scripts/resultfail.sh"
VMKIT_FLAVOR_RESULTFAIL_TIMEOUT=30
VMKIT_FLAVOR_SKIPFLAVOR_LINUX="vmtest/scripts/skipflavor.sh"
VMKIT_FLAVOR_SKIPFLAVOR_TIMEOUT=30
VMKIT_FLAVOR_CRLF_LINUX="vmtest/scripts/crlf.sh"
VMKIT_FLAVOR_CRLF_TIMEOUT=30

# Host hold.
VMKIT_FLAVOR_HOLDCHECK_LINUX="vmtest/scripts/holdcheck.sh"
VMKIT_FLAVOR_HOLDCHECK_TIMEOUT=30

# macOS push granularity (only the script's own directory travels).
VMKIT_FLAVOR_SIBLINGLIB_MACOS="vmtest/scripts/siblinglib.sh"
VMKIT_FLAVOR_SIBLINGLIB_TIMEOUT=30

VMKIT_ENV_FORWARD=""
VMKIT_KILL_WINDOWS=""
VMKIT_KILL_UNIX=""

# Scripts that must be refused before a VM is booted at all.
VMKIT_FLAVOR_BADASCII_WINDOWS="vmtest/broken/badascii.ps1"
VMKIT_FLAVOR_BADSYNTAX_LINUX="vmtest/broken/badsyntax.sh"
VMKIT_FLAVOR_SIBLINGSOURCE_LINUX="vmtest/broken/siblingsource.sh"
